<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JobMatcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../icons/icon48.png" alt="" width="28" height="28" />
        <div>
          <h1>JobMatcher</h1>
          <span class="tagline">Resume-fit at a glance</span>
        </div>
      </div>
      <button id="openOptions" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"></path>
        </svg>
      </button>
    </header>

    <main>
      <button id="analyzeBtn">
        <span class="btn-label">Analyze this page</span>
      </button>

      <div id="status" class="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="statusText"></span>
      </div>

      <section id="result" class="result" hidden>
        <div class="score-card">
          <div class="score-ring" id="scoreRing">
            <div class="score-inner"><span id="scoreValue">--</span><small>fit</small></div>
          </div>
          <p id="summary"></p>
        </div>

        <div class="group">
          <h2><span class="dot dot-good"></span>Matched</h2>
          <div id="matchedSkills" class="pills"></div>
        </div>

        <div class="group">
          <h2><span class="dot dot-gap"></span>Gaps</h2>
          <div id="gaps" class="pills"></div>
        </div>

        <div class="tip">
          <h2>💡 Tip</h2>
          <p id="recommendation"></p>
        </div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
